version: '3.8'

services:
  # generates the site; listens on nothing, so it carries no caddy labels
  xdocc:
    image: ghcr.io/tbocek/xdocc:v9
    user: "1000:1000"
    volumes:
      - site:/srv/site:ro
      - www:/srv/www:rw

  # serves what xdocc generated, and takes the source in over WebDAV
  web:
    image: ghcr.io/tbocek/xdocc-caddy:v9
    networks:
      - default
      - web
    volumes:
      - www:/srv/www:ro
      - site:/srv/site:rw
    secrets:
      - DSL_WEBDAV_USER
      - DSL_WEBDAV_HASH
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    deploy:
      labels:
        caddy: dsl.i-ost.ch
        caddy.reverse_proxy: '{{upstreams http 8080}}'

volumes:
  site: {}
  www: {}

networks:
  web:
    external: true
    name: web

configs:
  caddyfile:
    file: ./Caddyfile
    name: xdocc-caddyfile-v9

secrets:
  DSL_WEBDAV_USER:
    external: true
  DSL_WEBDAV_HASH:
    external: true
