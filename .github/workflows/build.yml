name: build-and-release

permissions:
  contents: write
  packages: write

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '.') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
            -o dist/xdocc-linux-amd64 ./cmd/xdocc
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/xdocc-*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '.') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          # every release is the newest one - the versions only count up - so
          # the tag it was made under and "latest" always mean the same image
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Caddy with the WebDAV module linked in, for the Portainer stack. It has
  # nothing to do with the xdocc version and only rides along on the tag.
  caddy:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '.') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .portainer
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-caddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
