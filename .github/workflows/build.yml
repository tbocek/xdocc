name: build-and-release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26'

jobs:
  # One job builds every platform. Go cross-compiles without CGo, so a second
  # runner would buy nothing, and the checksums file has to be written where
  # all the archives are anyway. It also means one job creates the release,
  # so there is no race over who creates it first.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # the release notes are every commit since the previous tag, so the
          # history and the tags have to be here
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build and package
        # release.sh --package is what a maintainer runs locally with
        # --dry-run, so the platform list, the archives and the notes are
        # written down once and cannot drift between here and there. It stamps
        # -X main.version with the tag; an unstamped build reports "dev".
        run: ./release.sh "${{ github.ref_name }}" --package

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --title "xdocc $tag" \
            --notes-file dist/notes.md "${prerelease[@]}"
          gh release upload "$tag" \
            dist/*.tar.gz dist/*.zip dist/*_checksums.txt --clobber

  # The image is independent of the archives, so it builds alongside them.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        # a release candidate is published under its own tag but must not
        # become what "docker pull xdocc" hands out
        run: |
          tag="${{ github.ref_name }}"
          tags="ghcr.io/${{ github.repository }}:$tag"
          case "$tag" in
            *-*) ;;
            *) tags="$tags"$'\n'"ghcr.io/${{ github.repository }}:latest" ;;
          esac
          { echo 'value<<EOF'; echo "$tags"; echo EOF; } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
